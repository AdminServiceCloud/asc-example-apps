# User-facing settings of one MariaDB instance, mapped to the environment
# variables documented by the official mariadb image (MARIADB_* — the
# modern names; the image also accepts the older MYSQL_* aliases).
# Schema: https://registry.adminservice.cloud/schema/asc.settings.schema.json
settings:
  - key: root_password
    type: secret
    title: "Root password"
    required: true
    env: MARIADB_ROOT_PASSWORD

  - key: database
    type: string
    title: "Default database"
    description: "Created on first start if set (MARIADB_DATABASE)"
    required: false
    limits: { max_length: 64 }
    env: MARIADB_DATABASE

  - key: username
    type: string
    title: "Additional user"
    description: "Created on first start alongside root, granted full access to the default database (MARIADB_USER)"
    required: false
    limits: { max_length: 32 }
    env: MARIADB_USER

  - key: password
    type: secret
    title: "Additional user password"
    description: "Required if 'username' is set (MARIADB_PASSWORD)"
    required: false
    env: MARIADB_PASSWORD

  - key: port
    type: ports
    title: "Port"
    default: [3306]
    limits: { min: 1024, max: 65535 }
    protocol: tcp

  - key: data
    type: volumes
    title: "Data volume"
    default: [/var/lib/mysql]

# First-run questionnaire. The database and user are only created on the very
# first start (empty data volume), so it is worth answering before launching.
setup:
  title: "MariaDB setup"
  description: "A few questions before the first start. The database and user are created only once, on the first start."
  questions:
    - setting: root_password
      question: "Choose a root password"
      hint: "Full administrator access to the server"
      required: true
    - setting: database
      question: "Database to create"
      hint: "Leave empty to create no database"
    - setting: username
      question: "Application user"
      hint: "Gets full access to the database above; leave empty to skip"
    - setting: password
      question: "Application user password"
      hint: "Needed if you set an application user"

quota:
  max_cpu: 1
  max_ram: 1G
  max_disk: 10G
