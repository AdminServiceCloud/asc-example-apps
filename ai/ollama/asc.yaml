# Ollama: local LLM runtime (pull and serve open models over an HTTP API).
# Runs on the CPU by default. To use the host's GPUs, pick them in the app's
# settings after install (`asc app settings ollama` → gpus, or Settings →
# Resources → Graphics cards on the platform); the daemon attaches the cards to
# the container (asc-daemon 0.55.0+, Docker apps only).
# Schema: https://registry.adminservice.cloud/schema/asc.schema.json
name: ollama
version: 0.5.7
type: docker
title: Ollama
description: "Local LLM runtime: pull and serve open models (Llama, Mistral, Qwen, ...) over an HTTP API"
category: ai
settings: ./asc.settings.yaml

runtime:
  image: ollama/ollama:0.5.7

requirements:
  ram: 8G
  disk: 20G
  cpu: 4

healthcheck:
  http: /
  interval: 30s
